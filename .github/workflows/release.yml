name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev build-essential libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Prism Music Player ${{ github.ref_name }}'
          releaseBody: 'See release description for details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Standalone Portable Binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE_PATH=""
          if [ -f "src-tauri/target/release/prism_music_player.exe" ]; then
            EXE_PATH="src-tauri/target/release/prism_music_player.exe"
          elif [ -f "src-tauri/target/release/Prism Music Player.exe" ]; then
            EXE_PATH="src-tauri/target/release/Prism Music Player.exe"
          elif [ -f "src-tauri/target/x86_64-pc-windows-msvc/release/prism_music_player.exe" ]; then
            EXE_PATH="src-tauri/target/x86_64-pc-windows-msvc/release/prism_music_player.exe"
          elif [ -f "src-tauri/target/x86_64-pc-windows-msvc/release/Prism Music Player.exe" ]; then
            EXE_PATH="src-tauri/target/x86_64-pc-windows-msvc/release/Prism Music Player.exe"
          else
            EXE_PATH=$(find src-tauri/target -type f \( -name "prism_music_player.exe" -o -name "Prism Music Player.exe" \) | grep -E "release[/\\\\]" | head -n 1)
          fi

          if [ -n "$EXE_PATH" ] && [ -f "$EXE_PATH" ]; then
            echo "Found standalone binary at: $EXE_PATH"
            cp "$EXE_PATH" "Prism.Music.Player.exe"
            gh release upload "${{ github.ref_name }}" "Prism.Music.Player.exe" --clobber
            echo "Successfully uploaded Prism.Music.Player.exe to release ${{ github.ref_name }}"
          else
            echo "::error::Standalone binary not found! Available executables:"
            find src-tauri/target -name "*.exe" || true
            exit 1
          fi

