<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- 
      DYNAMIC REFRACTION GRADIENT
      ===============================================================
      This gradient uses CSS Custom Properties (Variables) to allow 
      for dynamic color injection (e.g., from an extracted album art palette).
      
      To update these colors programmatically, apply the following variables 
      to the parent container of this SVG via CSS or JavaScript:
      element.style.setProperty('--color-stop-1', '#NEW_HEX');
      
      If no variables are provided by the application, the gradient 
      safely falls back to the default vibrant rainbow hex values below.
    -->
    <linearGradient id="refraction" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-stop-1, #FF3B30)" />
      <stop offset="20%" stop-color="var(--color-stop-2, #FFCC00)" />
      <stop offset="40%" stop-color="var(--color-stop-3, #34C759)" />
      <stop offset="60%" stop-color="var(--color-stop-4, #00C7BE)" />
      <stop offset="80%" stop-color="var(--color-stop-5, #007AFF)" />
      <stop offset="100%" stop-color="var(--color-stop-6, #AF52DE)" />
    </linearGradient>
  </defs>

  <!-- Left Input Sine Wave (Solid Silver, Shortened) -->
  <path d="M 131.15 100 q 15 -35, 30 0 t 30 0 t 30 0" 
        fill="none" stroke="#A1A1AA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Output Sine Wave (Vibrant Rainbow, Shortened) -->
  <path d="M 278.85 100 q 15 -35, 30 0 t 30 0 t 30 0" 
        fill="none" stroke="url(#refraction)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Grounded Prism (Dark Charcoal) -->
  <polygon points="250,50 192.3,150 307.7,150" 
           fill="none" stroke="#1E1E1E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
